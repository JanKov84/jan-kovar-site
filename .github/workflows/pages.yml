name: Verify site and optionally deploy

# Adding this file does not build or publish on push.
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish the verified build to an already configured GitHub Pages site
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  SITE_BASE_URL: https://jan-kovar.eu/
  HUGO_VERSION: '0.162.0'
  PNPM_VERSION: '10.14.0'
  NODE_VERSION: '24'
  GO_VERSION: '1.27.1'
  TZ: Europe/Prague

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HUGO_CACHEDIR: /tmp/hugo_cache_runner
      GOTOOLCHAIN: local
    steps:
      - name: Check out public site source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Install pinned Hugo Extended
        env:
          HUGO_SHA256: b118d52077bcb301c8d8031f116c04d9dd848e4a5cab572ca10905ea94791216
        run: |
          archive="${RUNNER_TEMP}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$HUGO_SHA256" "$archive" | sha256sum --check --status
          mkdir -p .tools/hugo
          tar --extract --gzip --file "$archive" --directory .tools/hugo hugo
          .tools/hugo/hugo version

      - name: Install pinned pnpm
        env:
          PNPM_SHA512: rSenlkG0nD5IGhaoBbqnGBegS74Go40X5g4urug/ahRsamiBJfV5LkjdW6MOfaUqXNpMOZK5zPMz+c4iOvhHSA==
        run: |
          archive="${RUNNER_TEMP}/pnpm-${PNPM_VERSION}.tgz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://registry.npmjs.org/pnpm/-/pnpm-${PNPM_VERSION}.tgz" \
            --output "$archive"
          actual=$(node -e 'const fs = require("node:fs"); const crypto = require("node:crypto"); process.stdout.write(crypto.createHash("sha512").update(fs.readFileSync(process.argv[1])).digest("base64"));' "$archive")
          test "$actual" = "$PNPM_SHA512"
          mkdir -p .tools/pnpm
          tar --extract --gzip --file "$archive" --directory .tools/pnpm --strip-components=1
          node .tools/pnpm/bin/pnpm.cjs --version

      - name: Install locked dependencies
        run: |
          node .tools/pnpm/bin/pnpm.cjs install --frozen-lockfile --store-dir .cache/pnpm-store
          go mod download all

      - name: Build for the project URL
        run: .tools/hugo/hugo --minify --environment production --baseURL "$SITE_BASE_URL"

      - name: Check content, privacy, metadata and local links
        run: node scripts/check-site.mjs public "$SITE_BASE_URL"

      # Packaging an artifact does not enable Pages or deploy a website.
      - name: Upload verified site artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./public
          include-hidden-files: false
          retention-days: 7

  deploy:
    name: Publish only when explicitly requested
    if: ${{ inputs.deploy == true }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # This read fails if Pages has not been enabled manually. Never enable it here.
      - name: Read existing Pages configuration
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: false

      - name: Deploy verified artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
