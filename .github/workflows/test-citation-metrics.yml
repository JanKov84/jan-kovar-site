name: Test citation metrics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  citation-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::rvest
            any::jsonlite
            github::frbcesab/rwosstarter

      # TEMPORARY diagnostic: remove after basic ScraperAPI connectivity is confirmed.
      - name: Test basic ScraperAPI connectivity
        env:
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
        run: |
          Rscript -e '
            suppressPackageStartupMessages(library(rvest))
            key <- Sys.getenv("SCRAPERAPI_KEY", unset = "")
            if (!nzchar(trimws(key))) {
              message("ScraperAPI basic test: failure")
              quit(status = 0)
            }
            fetch_url <- paste0(
              "https://api.scraperapi.com?api_key=", utils::URLencode(key, reserved = TRUE),
              "&url=", utils::URLencode("https://example.com/", reserved = TRUE)
            )
            tryCatch({
              doc <- withCallingHandlers(
                rvest::read_html(fetch_url),
                warning = function(warning) invokeRestart("muffleWarning")
              )
              message("ScraperAPI basic test: success")
            }, error = function(error) {
              message("ScraperAPI basic test: failure")
            })
          '

      - name: Fetch citation metrics
        env:
          WOS_STARTER_KEY: ${{ secrets.WOS_STARTER_KEY }}
          CITATION_METRICS_OUTPUT: ${{ runner.temp }}/citation-metrics.json
        run: Rscript scripts/update_citation_metrics.R

      - name: Upload citation metrics artifact
        uses: actions/upload-artifact@v4
        with:
          name: citation-metrics-test
          path: ${{ runner.temp }}/citation-metrics.json
          if-no-files-found: error
