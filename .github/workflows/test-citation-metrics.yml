name: Test citation metrics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  citation-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'

      - name: Install R dependencies
        env:
          R_LIBS_USER: ${{ runner.temp }}/R-library
        run: |
          Rscript -e 'install.packages(c("rvest", "jsonlite", "remotes"), repos = "https://cloud.r-project.org")'
          Rscript -e 'remotes::install_github("FRBCesab/rwosstarter", upgrade = "never")'

      - name: Fetch citation metrics
        env:
          R_LIBS_USER: ${{ runner.temp }}/R-library
          WOS_STARTER_KEY: ${{ secrets.WOS_STARTER_KEY }}
          CITATION_METRICS_OUTPUT: ${{ runner.temp }}/citation-metrics.json
        run: Rscript scripts/update_citation_metrics.R

      - name: Upload citation metrics artifact
        uses: actions/upload-artifact@v4
        with:
          name: citation-metrics-test
          path: ${{ runner.temp }}/citation-metrics.json
          if-no-files-found: error
