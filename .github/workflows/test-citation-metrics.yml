name: Test citation metrics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  citation-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::rvest
            any::jsonlite
            github::frbcesab/rwosstarter

      - name: Probe Google Scholar HTTP response
        run: |
          set +e
          diagnostics=$(curl --silent --show-error --output /dev/null \
            --write-out 'http_code=%{http_code}\neffective_url=%{url_effective}\n' \
            --user-agent 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)' \
            'https://scholar.google.com/citations?user=IAWEh-4AAAAJ&hl=en')
          curl_exit=$?
          printf '%s\n' "$diagnostics"
          if [ "$curl_exit" -ne 0 ]; then
            printf 'curl_exit_code=%s\n' "$curl_exit"
          fi
          exit 0

      - name: Fetch citation metrics
        env:
          WOS_STARTER_KEY: ${{ secrets.WOS_STARTER_KEY }}
          CITATION_METRICS_OUTPUT: ${{ runner.temp }}/citation-metrics.json
        run: Rscript scripts/update_citation_metrics.R

      - name: Upload citation metrics artifact
        uses: actions/upload-artifact@v4
        with:
          name: citation-metrics-test
          path: ${{ runner.temp }}/citation-metrics.json
          if-no-files-found: error
