name: Test citation metrics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  citation-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::rvest
            any::jsonlite
            github::frbcesab/rwosstarter

      - name: Fetch citation metrics
        env:
          WOS_STARTER_KEY: ${{ secrets.WOS_STARTER_KEY }}
          CITATION_METRICS_OUTPUT: ${{ runner.temp }}/citation-metrics.json
        run: Rscript scripts/update_citation_metrics.R

      - name: Upload citation metrics artifact
        uses: actions/upload-artifact@v4
        with:
          name: citation-metrics-test
          path: ${{ runner.temp }}/citation-metrics.json
          if-no-files-found: error
