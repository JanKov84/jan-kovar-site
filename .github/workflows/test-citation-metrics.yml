name: Test citation metrics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  citation-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::rvest
            any::jsonlite
            github::frbcesab/rwosstarter

      # TEMPORARY diagnostic: remove after the ScraperAPI A/B result is reviewed.
      - name: Compare Scholar ScraperAPI responses
        env:
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
        run: |
          Rscript -e '
            suppressPackageStartupMessages(library(rvest))
            options(HTTPUserAgent = "Mozilla/5.0 (Windows NT 10.0; Win64; x64)")
            key <- Sys.getenv("SCRAPERAPI_KEY", unset = "")
            if (!nzchar(trimws(key))) {
              message("Scholar A/B diagnostic skipped: SCRAPERAPI_KEY is not set.")
              quit(status = 0)
            }
            fetch_profile <- function(label, scholar_url) {
              fetch_url <- paste0(
                "https://api.scraperapi.com?api_key=", utils::URLencode(key, reserved = TRUE),
                "&url=", utils::URLencode(scholar_url, reserved = TRUE)
              )
              tryCatch({
                doc <- withCallingHandlers(
                  rvest::read_html(fetch_url),
                  warning = function(warning) invokeRestart("muffleWarning")
                )
                stats <- rvest::html_elements(doc, ".gsc_rsb_std")
                message(label, ": success; .gsc_rsb_std found=", length(stats) > 0L, "; values=", length(stats))
              }, error = function(error) {
                message(label, ": failure")
              })
            }
            fetch_profile("Jan", "https://scholar.google.com/citations?user=IAWEh-4AAAAJ&hl=en")
            fetch_profile("Colleague", "https://scholar.google.com/citations?user=sEcbAPUAAAAJ&hl=en&pagesize=100")
          '

      - name: Fetch citation metrics
        env:
          WOS_STARTER_KEY: ${{ secrets.WOS_STARTER_KEY }}
          CITATION_METRICS_OUTPUT: ${{ runner.temp }}/citation-metrics.json
        run: Rscript scripts/update_citation_metrics.R

      - name: Upload citation metrics artifact
        uses: actions/upload-artifact@v4
        with:
          name: citation-metrics-test
          path: ${{ runner.temp }}/citation-metrics.json
          if-no-files-found: error
